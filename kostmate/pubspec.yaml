name: kostmate
description: PKKWU Project - KostMate App
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  # Daftarkan font Poppins
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

  # Daftarkan asset gambar/logo
  assets:
    - assets/images/FullLogo.png
    - assets/images/homeicon.png
    - assets/images/groubicon.png
    - assets/images/smileyicon.png
    - assets/images/laundryicon.png